name: Sync ForceDecks Data

on:
  schedule:
    - cron: '0 */6 * * *'
  # On-demand trigger: pushing a change to vald_sync.py (or this file) fires an
  # incremental sync, so new tests can be pulled without waiting for the cron.
  push:
    paths:
      - 'vald_sync.py'
      - '.github/workflows/sync-forcedecks.yml'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Full sync (re-pull all tests from 2020)'
        required: false
        default: 'false'
        type: boolean

env:
  VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
  VALD_CLIENT_SECRET: ${{ secrets.VALD_CLIENT_SECRET }}
  VALD_AUDIENCE: vald-api-external
  VALD_TENANT_ID: 3127f695-175f-4b63-8331-f1295a34cd51

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    # A --full re-pull refetches trials for every test one-by-one (~16.3k
    # requests). That measured ~120min and was being killed mid-run, so the
    # sync never committed. GitHub's hosted-runner cap is 360.
    timeout-minutes: 330

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: vald_sync_state.json
          key: vald-sync-state-${{ github.run_id }}
          restore-keys: |
            vald-sync-state-

      - name: Run VALD Sync
        run: |
          MSG="$(git log -1 --pretty=%B)"
          ARGS=""
          [ "${{ github.event.inputs.full_sync }}" == "true" ] && ARGS="--full"
          # A metric-definition change needs a re-pull of existing tests (an
          # incremental only ADDS new ones). [full-sync] re-pulls everything
          # (>5.5h, usually too big). [refresh-cmj] re-pulls only CMJ tests
          # (~half; parallel) and merges — use it for a CMJ-only metric like RSI.
          echo "$MSG" | grep -q '\[full-sync\]' && ARGS="--full"
          echo "$MSG" | grep -q '\[refresh-cmj\]' && ARGS="--refresh-cmj"
          echo "$MSG" | grep -q '\[refresh-hop\]' && ARGS="--refresh-hop"
          echo "running: python vald_sync.py $ARGS"
          python vald_sync.py $ARGS

      - name: Generate portal data
        run: |
          # Target src/App.jsx explicitly: a STALE root App.jsx also exists, and
          # `find | head -1` could pick it (it lacks the _PR/_HD/_VELO markers),
          # silently generating against the wrong file. Also pass trackman so the
          # velo/_TMR arrays aren't regenerated empty.
          APP_JSX=src/App.jsx
          if [ ! -f "$APP_JSX" ]; then
            echo "ERROR: $APP_JSX not found"
            exit 1
          fi
          python generate_portal_data.py forcedecks_portal.json "$APP_JSX" trackman_portal.json
          if [ -f "App_updated.jsx" ]; then
            mv App_updated.jsx "$APP_JSX"
            echo "Replaced $APP_JSX with updated data"
          else
            echo "ERROR: App_updated.jsx not generated"
            exit 1
          fi

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "has_changes=false" >> "$GITHUB_OUTPUT" || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "RPM Auto-Sync"
          git config user.email "sync@rpmstrength.coach"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          ATHLETES=$(python -c "import json; d=json.load(open('forcedecks_portal.json')); print(d['meta']['totalAthletes'])" 2>/dev/null || echo "?")
          TESTS=$(python -c "import json; d=json.load(open('forcedecks_portal.json')); print(d['meta']['totalTests'])" 2>/dev/null || echo "?")
          # This used to be a bare `git commit && git push`, which is rejected if
          # main moved during the run — throwing the whole sync away. A --full
          # re-pull takes ~4h and the DynaMo/ForceDecks crons fire every 6h, so a
          # collision is near-certain (it ate the 2026-07-15 RSI re-pull).
          # Rebuild on top of current main instead of rebasing: the synced JSON is
          # ours, and App.jsx / portal_data_arrays.js are pure functions of the
          # JSONs, so regenerating after reset gives a conflict-free result.
          mkdir -p /tmp/synced
          cp forcedecks_portal.json vald_sync_state.json /tmp/synced/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/synced/forcedecks_portal.json /tmp/synced/vald_sync_state.json .
            python generate_portal_data.py forcedecks_portal.json src/App.jsx trackman_portal.json
            if [ -f App_updated.jsx ]; then mv App_updated.jsx src/App.jsx; fi
            git add -A
            if git diff --cached --quiet; then echo "no changes after rebuild"; exit 0; fi
            git commit -m "🔄 ForceDecks sync: ${TIMESTAMP} (${ATHLETES} athletes, ${TESTS} tests)"
            if git push; then echo "pushed on attempt ${attempt}"; exit 0; fi
            echo "push rejected (main moved) — rebuilding, attempt ${attempt}"
          done
          echo "ERROR: could not push after 3 attempts"; exit 1

      - name: Job summary
        if: always()
        run: |
          echo "### 🏋️ ForceDecks Sync Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **New data pushed → Vercel auto-deploying**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **No new data since last sync — deploy skipped**" >> $GITHUB_STEP_SUMMARY
          fi
