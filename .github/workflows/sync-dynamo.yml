name: Sync DynaMo Data

# API contract verified against the live public Swagger spec (2026-07-14);
# pipeline validated end-to-end on live data the same day.
# Schedule is offset 3h from the ForceDecks sync (0 */6) so they never race.
on:
  schedule:
    - cron: '0 3/6 * * *'
  push:
    paths:
      - 'dynamo_sync.py'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Full sync (re-pull all DynaMo tests from 2020)'
        required: false
        default: 'false'
        type: boolean

env:
  VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
  VALD_CLIENT_SECRET: ${{ secrets.VALD_CLIENT_SECRET }}
  VALD_TENANT_ID: 3127f695-175f-4b63-8331-f1295a34cd51

jobs:
  sync-dynamo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run DynaMo sync
        run: |
          ARGS=""
          [ "${{ github.event.inputs.full_sync }}" == "true" ] && ARGS="$ARGS --full"
          # push-triggered runs do a full pull (cheap — DynaMo test counts are small)
          [ "${{ github.event_name }}" == "push" ] && ARGS="--full"
          echo "python dynamo_sync.py $ARGS"
          python dynamo_sync.py $ARGS

      - name: Regenerate portal data
        run: |
          python generate_portal_data.py forcedecks_portal.json src/App.jsx trackman_portal.json
          if [ -f "App_updated.jsx" ]; then mv App_updated.jsx src/App.jsx; fi

      - name: Commit and push if changed
        run: |
          git config user.name "RPM Auto-Sync"
          git config user.email "sync@rpmstrength.coach"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 DynaMo sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
