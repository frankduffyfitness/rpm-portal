name: Probe DynaMo API Access

# Temporary diagnostic: runs whenever dynamo_probe.py changes, probes the VALD
# DynaMo API with the CI-held credentials, and commits the sanitized findings
# back as dynamo_probe_result.json (no tokens/secrets are ever written).
# Delete this workflow + dynamo_probe.py once dynamo_sync.py is validated.
on:
  push:
    paths:
      - 'dynamo_probe.py'
  workflow_dispatch:

env:
  VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
  VALD_CLIENT_SECRET: ${{ secrets.VALD_CLIENT_SECRET }}
  VALD_TENANT_ID: 3127f695-175f-4b63-8331-f1295a34cd51

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run probe
        run: python dynamo_probe.py

      - name: Commit findings back
        run: |
          git config user.name "RPM Auto-Sync"
          git config user.email "sync@rpmstrength.coach"
          git pull --rebase
          git add dynamo_probe_result.json
          git commit -m "🔎 DynaMo API probe results" || echo "no changes"
          git push
